<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>StockPilot — Inventory</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#16202a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand-2:#14b8a6; --brand-soft:#ccfbf1;
  --red:#dc2626; --red-soft:#fee2e2; --amber:#b45309; --amber-soft:#fef3c7; --green:#15803d; --green-soft:#dcfce7;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1117; --card:#131c25; --text:#e6edf3; --muted:#8b9bb0; --line:#223040;
    --brand:#2dd4bf; --brand-2:#14b8a6; --brand-soft:#0f3b38;
    --red:#f87171; --red-soft:#3b1515; --amber:#fbbf24; --amber-soft:#3a2a0a; --green:#4ade80; --green-soft:#0f2e1a;
    --shadow:0 1px 2px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:1.45rem;margin:0}
h2{font-size:1.2rem;margin:0 0 14px}
h3{font-size:1rem;margin:0 0 10px}
a{color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
[hidden]{display:none!important}

/* layout */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.spacer{flex:1}
.pill{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.err{background:var(--red-soft);color:var(--red)}
.who{font-size:.82rem;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:18px 16px 96px;max-width:1150px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a,.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;text-decoration:none;color:var(--muted);font-size:.7rem;background:none;border:0;cursor:pointer}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--brand);font-weight:600}
.nav .scanbtn span.ic{width:50px;height:50px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.35)}
.nav .scanbtn{color:var(--brand);font-weight:600}
@media (min-width:900px){
  .nav{top:53px;bottom:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;align-items:stretch;border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:4px}
  .nav a,.nav button{flex:none;flex-direction:row;gap:12px;padding:10px 12px;border-radius:10px;font-size:.95rem}
  .nav a.on{background:var(--brand-soft)}
  .nav .scanbtn{order:-1;margin-bottom:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
  .nav .scanbtn span.ic{width:auto;height:auto;margin:0;background:none;box-shadow:none}
  main{margin-left:200px;padding:24px 28px 40px}
}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.vhead h1{flex:1;min-width:140px}
.hbtns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#04201d}}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:70px;resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 260px}
.toolbar select{flex:0 1 180px}
.chk{display:flex;align-items:center;gap:6px;font-size:.9rem;white-space:nowrap;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-size:1.5rem;font-weight:700;margin-top:2px}
.stat.alert .v{color:var(--red)}
.grid2{display:grid;gap:16px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.row:hover{border-color:var(--brand)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{font-weight:700;min-width:64px;text-align:right}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.low{background:var(--amber-soft);color:var(--amber)}
.badge.out{background:var(--red-soft);color:var(--red)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.plus{color:var(--green);font-weight:700}
.minus{color:var(--red);font-weight:700}
.mini{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.mini:last-child{border-bottom:0}
.mini .l{min-width:0;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right}
.tablewrap{overflow:auto;max-height:55vh;border:1px solid var(--line);border-radius:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{color:var(--text);font-size:15px}
.full{grid-column:1/-1}
.inrow{display:flex;gap:8px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.bigqty{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.bigqty .n{font-size:2.4rem;font-weight:800;line-height:1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.adjbox{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center}
@media (max-width:560px){.adjbox{grid-template-columns:1fr 1fr}.adjbox .btn{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.cnt-row{display:grid;grid-template-columns:1fr 80px 96px 44px;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.cnt-row.done{border-left:4px solid var(--brand)}
.cnt-row input{padding:8px;text-align:right}
@media (max-width:560px){.cnt-row{grid-template-columns:1fr 84px 44px}.cnt-row .exp{display:none}}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.8rem;overflow:auto}
.settings{display:grid;gap:16px;max-width:760px}

/* modal / toast */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{position:relative;background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.modal.wide{max-width:820px}
@media (min-width:700px){.backdrop{align-items:center}.modal{border-radius:18px}}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:200px}
#reader video{border-radius:12px}
.scanres{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);min-height:42px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--red)}
.toast.ok{background:#0f766e}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
#login .err{color:var(--red);font-size:.88rem;min-height:1em}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:4px}
.langs button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:.82rem;cursor:pointer}
.langs button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="card" id="loginForm">
    <div class="langs" data-noi18n>
      <button type="button" data-lang="en">English</button><button type="button" data-lang="bg">Български</button><button type="button" data-lang="tr">Türkçe</button><button type="button" data-lang="ru">Русский</button>
    </div>
    <div class="logo"><i>▦</i> StockPilot</div>
    <p class="muted small" style="margin:0">Sign in to your team's inventory.</p>
    <input type="email" id="lEmail" placeholder="Email" required autocomplete="email">
    <input type="password" id="lPass" placeholder="Password (min. 6 characters)" required autocomplete="current-password">
    <div class="err" id="lErr"></div>
    <button class="btn primary" type="submit">Sign in</button>
    <button class="btn" type="button" id="lSignup">Create account</button>
    <button class="btn ghost small" type="button" id="lLocal">Use offline on this device instead</button>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="logo"><i>▦</i> StockPilot</div>
    <div class="spacer"></div>
    <span class="pill" id="sync">…</span>
    <span class="who" id="who"></span>
  </header>
  <nav class="nav" id="nav">
    <a href="#dashboard" data-r="dashboard"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
    <a href="#products" data-r="products"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span>Products</span></a>
    <button class="scanbtn" id="navScan" type="button"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg></span><span>Scan</span></button>

    <a href="#movements" data-r="movements"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4"/><path d="M17 20V4M13 8l4-4 4 4"/></svg><span>Log</span></a>
    <a href="#settings" data-r="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Settings</span></a>
  </nav>
  <main id="view"></main>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

function tr(s){
  if(LI === undefined || s == null) return s;
  s = String(s); const k = s.trim(); if(!k) return s;
  let out = DICT.get(k)?.[LI];
  if(!out) for(const [re, t] of PATS) if(re.test(k)){ out = k.replace(re, t[LI]); break; }
  return out ? s.replace(k, () => out) : s;
}
const I18N_ATTRS = ['placeholder', 'title', 'aria-label'];
const skipEl = el => !el || el.closest('script,style,textarea,pre,[data-noi18n]');
function trAttrs(el){ for(const a of I18N_ATTRS){ const v = el.getAttribute?.(a); if(v){ const t = tr(v); if(t !== v) el.setAttribute(a, t); } } }
function trNode(root){
  if(root.nodeType === 3){ if(!skipEl(root.parentElement)){ const t = tr(root.nodeValue); if(t !== root.nodeValue) root.nodeValue = t; } return; }
  if(root.nodeType !== 1 || skipEl(root)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {acceptNode: n =>
    n.nodeType === 1 && (/^(SCRIPT|STYLE|TEXTAREA|PRE)$/.test(n.tagName) || n.hasAttribute('data-noi18n')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  let n = root;
  do{ if(n.nodeType === 3){ const t = tr(n.nodeValue); if(t !== n.nodeValue) n.nodeValue = t; } else trAttrs(n); } while((n = w.nextNode()));
}
function setLang(l){ localStorage.setItem('sp_lang', l); location.reload(); }
document.documentElement.lang = LANG;
if(LI !== undefined){
  const nativeConfirm = window.confirm.bind(window);
  window.confirm = m => nativeConfirm(tr(m));
  trNode(document.body);
  new MutationObserver(ms => { for(const m of ms){ if(m.type === 'childList') m.addedNodes.forEach(trNode); else if(!skipEl(m.target)) trAttrs(m.target); } })
    .observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:I18N_ATTRS});
}

/* ============================================================
   BACKENDS — same interface for local and Firebase
   ============================================================ */
function setPath(obj, path, val){ const p = path.split('.'); let o = obj;
  for(let i=0;i<p.length-1;i++){ if(!o[p[i]] || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
  o[p.at(-1)] = val; }
function getPath(obj, path){ return path.split('.').reduce((o,k) => o?.[k], obj); }

function makeLocal(){
  const blank = () => ({products:{}, movements:{}, counts:{}});
  let db = JSON.parse(localStorage.getItem(LS.local) || 'null') || blank();
  const subs = {products:new Set(), movements:new Set(), counts:new Set()};
  const save = () => { try{ localStorage.setItem(LS.local, JSON.stringify(db)); }catch(e){ toast('Local storage full: '+e.message,'err'); } };
  const list = c => Object.entries(db[c]).map(([id,d]) => ({id, ...d}));
  const emit = c => subs[c].forEach(cb => cb(list(c)));
  const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  addEventListener('storage', e => { if(e.key === LS.local){ db = JSON.parse(e.newValue || 'null') || blank(); Object.keys(subs).forEach(emit); } });
  return {
    mode:'local',
    onAuth(cb){ cb({email:'This device', uid:'local'}); },
    setStatus(){ setSync('Local only (this device)', 'warn'); },
    watch(c, cb){ subs[c].add(cb); cb(list(c)); return () => subs[c].delete(cb); },
    add(c, data){ const k = nid(); db[c][k] = data; save(); emit(c); return k; },
    update(c, k, patch){ const d = db[c][k]; if(!d) return; for(const [p,v] of Object.entries(patch)) setPath(d, p, v); save(); emit(c); },
    remove(c, k){ delete db[c][k]; save(); emit(c); },
    inc(c, k, path, n){ const d = db[c][k]; if(!d) return; setPath(d, path, num(getPath(d, path)) + n); save(); emit(c); },
    move(pid, delta, type, note, user){
      const p = db.products[pid]; if(!p) throw new Error('Product not found');
      const before = num(p.qty); p.qty = round(before + delta); p.updatedAt = Date.now();
      db.movements[nid()] = {productId:pid, productName:p.name, sku:p.sku||'', type, delta, before, after:p.qty, note:note||'', user, ts:Date.now()};
      save(); emit('products'); emit('movements');
    },
    clear(){ db = blank(); save(); Object.keys(subs).forEach(emit); },
    signOut(){},
  };
}

async function makeFirebase(cfg, ws){
  const V = '10.12.2';
  const [fa, au, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
  const app = fa.initializeApp(cfg);
  const auth = au.getAuth(app);
  let db;
  try{ db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
  catch{ db = fs.getFirestore(app); }
  const col = c => fs.collection(db, 'workspaces', ws, c);
  const ref = (c, k) => fs.doc(db, 'workspaces', ws, c, k);
  const onErr = e => { console.error(e); toast('Save failed: ' + (e.code || e.message), 'err'); };
  let pending = false, fromCache = false;
  const status = () => {
    if(!navigator.onLine || fromCache) setSync(pending ? 'Offline · changes queued' : 'Offline', 'warn');
    else setSync(pending ? 'Saving…' : 'Synced · ' + ws, '');
  };
  addEventListener('online', status); addEventListener('offline', status);
  return {
    mode:'firebase', ws,
    onAuth(cb){ au.onAuthStateChanged(auth, u => cb(u)); },
    setStatus: status,
    signIn: (e,p) => au.signInWithEmailAndPassword(auth, e, p),
    signUp: (e,p) => au.createUserWithEmailAndPassword(auth, e, p),
    signOut: () => au.signOut(auth),
    watch(c, cb){
      const q = c === 'movements' ? fs.query(col(c), fs.orderBy('ts','desc'), fs.limit(2000)) : col(c);
      return fs.onSnapshot(q, {includeMetadataChanges: c === 'products'}, snap => {
        if(c === 'products'){ pending = snap.metadata.hasPendingWrites; fromCache = snap.metadata.fromCache; status(); }
        cb(snap.docs.map(d => ({id:d.id, ...d.data()})));
      }, e => { console.error(e); setSync('Sync error', 'err'); toast('Sync error: ' + (e.code || e.message), 'err'); });
    },
    add(c, data){ const r = fs.doc(col(c)); fs.setDoc(r, data).catch(onErr); return r.id; },
    update(c, k, patch){ fs.updateDoc(ref(c,k), patch).catch(onErr); },
    remove(c, k){ fs.deleteDoc(ref(c,k)).catch(onErr); },
    inc(c, k, path, n){ fs.updateDoc(ref(c,k), {[path]: fs.increment(n)}).catch(onErr); },
    move(pid, delta, type, note, user){
      const p = prod(pid); if(!p) throw new Error('Product not found');
      const before = num(p.qty);
      const b = fs.writeBatch(db);
      b.update(ref('products', pid), {qty: fs.increment(delta), updatedAt: Date.now()});
      b.set(fs.doc(col('movements')), {productId:pid, productName:p.name, sku:p.sku||'', type, delta, before, after:round(before+delta), note:note||'', user, ts:Date.now()});
      b.commit().catch(onErr);
    },
  };
}

   ============================================================ */
function openScanner({title='Scan barcode', continuous=false, onCode, hint=''}){
  let sc = null, last = '', lastAt = 0, closed = false;
  const stop = async () => { closed = true; if(!sc) return; const s = sc; sc = null; try{ await s.stop(); }catch{} try{ s.clear(); }catch{} };
  const m = openModal(`<h2>${esc(title)}</h2>
    <div id="reader"></div>
    <div class="inrow" style="margin-top:10px"><input id="manualCode" placeholder="Or type / USB-scan a barcode or SKU" autocomplete="off"><button class="btn primary" id="manualGo">Go</button></div>
    ${hint ? `<p class="muted small" style="margin:8px 0 0">${hint}</p>` : ''}
    <div id="scanExtra"></div>`, {onClose: stop});
  const handle = code => {
    code = String(code).trim(); if(!code) return;
    const now = Date.now(); if(code === last && now - lastAt < 1800) return;
    last = code; lastAt = now;
    if(!continuous){ beep(true); closeModal(); onCode(code); }
    else onCode(code, m.querySelector('#scanExtra'));
  };
  m.querySelector('#manualGo').onclick = () => { const i = m.querySelector('#manualCode'); last=''; handle(i.value); i.value=''; i.focus(); };
  m.querySelector('#manualCode').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); m.querySelector('#manualGo').click(); } });
  if(typeof Html5Qrcode === 'undefined'){ m.querySelector('#reader').innerHTML = '<p class="muted" style="padding:16px;color:#ccc">Scanner library failed to load (offline?). Type the code below.</p>'; return; }
  sc = new Html5Qrcode('reader', {verbose:false});
  sc.start({facingMode:'environment'},
    {fps:12, qrbox:(w,h) => ({width:Math.max(120, Math.min(w*.85, 340)), height:Math.max(80, Math.min(h*.55, 200))}), aspectRatio:1.5},
    txt => handle(txt), () => {})
  .then(() => { if(closed) stop(); })
  .catch(err => {
    sc = null;
    const el = m.querySelector('#reader'); if(!el) return;
    el.innerHTML = `<p style="padding:16px;color:#ddd;margin:0">Camera not available: ${esc(err?.message || err)}.<br><small>Phones need the page served over HTTPS, and camera permission allowed. You can still type or USB-scan codes below.</small></p>`;
    m.querySelector('#manualCode').focus();
  });
}

    const data = { name:v.name.trim(), sku:(v.sku||'').trim(), barcode:(v.barcode||'').trim(), category:(v.category||'').trim(),
      location:(v.location||'').trim(), supplier:(v.supplier||'').trim(), unit:(v.unit||'').trim() || 'pcs',
      cost:num(v.cost), price:num(v.price), minQty:num(v.minQty), notes:(v.notes||'').trim(), updatedAt:Date.now() };
    if(!data.name) return;
    const dup = S.products.find(x => x.id !== p.id && ((data.barcode && norm(x.barcode) === norm(data.barcode)) || (data.sku && norm(x.sku) === norm(data.sku))));
    if(dup && !confirm(`"${dup.name}" already uses this SKU or barcode. Save anyway?`)) return;
    if(isNew){
      const q = round(num(v.qty));
      const id = backend.add('products', {...data, qty:q, createdAt:Date.now()});
      if(q) backend.add('movements', {productId:id, productName:data.name, sku:data.sku, type:'in', delta:q, before:0, after:q, note:'Starting stock', user:uname(), ts:Date.now()});
      toast('Product added', 'ok'); openProduct(id);
    } else { backend.update('products', p.id, data); toast('Saved', 'ok'); openProduct(p.id); }
  });
}

function openProduct(id){
  let mode = null;
  const m = openModal(`<div id="pd-head"></div><div id="pd-adj"></div><div id="pd-info"></div><h3 style="margin-top:18px">History</h3><div id="pd-hist"></div>`,
    {wide:true, refresh: () => render()});
  const adj = m.querySelector('#pd-adj');
  function renderAdj(){
    const p = prod(id); if(!p){ adj.innerHTML=''; return; }
    if(!mode){ adj.innerHTML = ''; return; }
    const label = {in:'Receive (add)', out:'Remove (sell / use / damage)', set:'Set exact quantity'}[mode];
    adj.innerHTML = `<form class="adjbox" id="adjForm"><input id="adjQty" type="number" step="any" ${mode==='set' ? `value="${num(p.qty)}"` : 'min="0" placeholder="Qty"'} required>
      <input id="adjNote" placeholder="Note (optional) — e.g. invoice #, reason">
      <button class="btn primary" type="submit">${label}</button></form>`;
    const q = adj.querySelector('#adjQty'); q.focus(); q.select?.();
    adj.querySelector('#adjForm').onsubmit = e => {
      e.preventDefault();
      const p = prod(id); const v = num(q.value); const note = adj.querySelector('#adjNote').value.trim();
      if(mode === 'in'){ if(v <= 0) return; move(id, v, 'in', note); toast(`+${fq(v)} ${p.unit||''} received`, 'ok'); }
      if(mode === 'out'){ if(v <= 0) return; if(v > num(p.qty) && !confirm(`Only ${fq(p.qty)} in stock. Remove ${fq(v)} anyway (stock goes negative)?`)) return; move(id, -v, 'out', note); toast(`−${fq(v)} ${p.unit||''} removed`, 'ok'); }
      if(mode === 'set'){ const d = v - num(p.qty); if(!d){ toast('No change'); } else { move(id, d, 'adjust', note); toast(`Quantity set to ${fq(v)}`, 'ok'); } }
      mode = null; renderAdj();
    };
  }
  function render(){
    const p = prod(id);
    const head = m.querySelector('#pd-head'); if(!head) return;
    if(!p){ head.innerHTML = '<p class="muted">Loading… (or this product was deleted)</p>'; m.querySelector('#pd-info').innerHTML=''; m.querySelector('#pd-hist').innerHTML=''; adj.innerHTML=''; return; }
    head.innerHTML = `<h2 style="margin:0 30px 2px 0">${esc(p.name)}</h2>
      <div class="chips">${[p.sku && 'SKU '+p.sku, p.category, p.location && '📍 '+p.location].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
      <div class="bigqty"><span class="n">${fq(p.qty)}</span><span class="muted">${esc(p.unit||'pcs')}</span> ${stockBadge(p)}</div>
      <div class="muted small">${num(p.minQty) ? `Minimum: ${fq(p.minQty)}` : 'No minimum set'}</div>
      <div class="seg" style="margin-top:12px">
        <button class="btn primary" data-a="in">+ Receive</button>
        <button class="btn" data-a="out">− Remove</button>
        <button class="btn" data-a="set">Set qty</button>
        <button class="btn sm ghost" data-a="p1">+1</button>
        <button class="btn sm ghost" data-a="m1">−1</button>
      </div>`;
    m.querySelector('#pd-info').innerHTML = `<div class="kv">
        <div><b>Barcode</b>${esc(p.barcode||'—')}</div>
        <div><b>Supplier</b>${esc(p.supplier||'—')}</div>
        <div><b>Cost</b>${money(p.cost)}</div>
        <div><b>Sale price</b>${money(p.price)}</div>
        <div><b>Stock value (cost)</b>${money(num(p.cost)*num(p.qty))}</div>
        <div><b>Last change</b>${fdate(p.updatedAt)||'—'}</div>
      </div>${p.notes ? `<p class="small" style="white-space:pre-wrap">${esc(p.notes)}</p>` : ''}
      <div class="seg"><button class="btn sm" data-a="edit">Edit details</button><button class="btn sm danger" data-a="del">Delete</button></div>`;
    const hist = S.movements.filter(x => x.productId === id).slice(0, 40);
    m.querySelector('#pd-hist').innerHTML = hist.length ? hist.map(mv => `<div class="mini"><div class="l"><b>${TYPES[mv.type]||mv.type}</b> <span class="muted small">${fdate(mv.ts)} · ${esc(mv.user||'')}${mv.note ? ' · '+esc(mv.note) : ''}</span></div>
      <div><span class="${mv.delta>0?'plus':'minus'}">${mv.delta>0?'+':''}${fq(mv.delta)}</span> <span class="muted small">→ ${fq(mv.after)}</span></div></div>`).join('') : '<p class="muted small">No movements yet.</p>';
  }
  m.addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if(!a) return;
    const p = prod(id); if(!p) return;
    if(a === 'in' || a === 'out' || a === 'set'){ mode = mode === a ? null : a; renderAdj(); }
    if(a === 'p1'){ move(id, 1, 'in', 'Quick +1'); }
    if(a === 'm1'){ move(id, -1, 'out', 'Quick −1'); }
    if(a === 'edit') productForm(p);
    if(a === 'del' && confirm(`Delete "${p.name}"? Its history stays in the log.`)){ backend.remove('products', id); closeModal(); toast('Product deleted'); }
  });
  render();
}

function importDialog(){
  const m = openModal(`<h2>Import products</h2>
    <p class="small">Upload an .xlsx or .csv file with a header row. Recognised columns: ${PRODUCT_COLS.join(', ')}</p>
    <p class="small muted">Rows are matched to existing products by SKU, then barcode. Matches are updated; others are created. If a qty column is present, stock is set to that value and logged as an adjustment.</p>
    <div class="seg"><button class="btn" id="tpl">Download template</button><button class="btn primary" id="pick">Choose file…</button></div>

  m.querySelector('#tpl').onclick = () => download('stockpilot-import-template.xlsx', sheetBook({Products:[{name:'Example T-shirt M', sku:'TS-M-BLK', barcode:'5901234123457', category:'Apparel', location:'A1-03', supplier:'Acme Ltd', unit:'pcs', cost:4.5, price:12.99, qty:40, minQty:10, notes:''}]}));

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      const res = importRows(rows);
      m.querySelector('#ires').innerHTML = `<p class="plus">Done: ${res.created} created, ${res.updated} updated, ${res.skipped} skipped (no name).</p>`;
      toast('Import finished', 'ok');
    }catch(err){ m.querySelector('#ires').innerHTML = `<p class="minus">Could not read file: ${esc(err.message)}</p>`; }
  };

function importRows(rows){
  const alias = {quantity:'qty', stock:'qty', onhand:'qty', min:'minQty', minqty:'minQty', minimum:'minQty', reorderlevel:'minQty', minstock:'minQty',
    productname:'name', product:'name', title:'name', ean:'barcode', upc:'barcode', code:'sku', costprice:'cost', saleprice:'price', shelf:'location'};
  const keyOf = h => { const k = norm(h).replace(/[\s_\-\.]/g,''); if(alias[k]) return alias[k]; return PRODUCT_COLS.find(c => c.toLowerCase() === k) || null; };
  let created = 0, updated = 0, skipped = 0;
  const bySku = new Map(S.products.filter(p=>p.sku).map(p => [norm(p.sku), p]));
  const byBc = new Map(S.products.filter(p=>p.barcode).map(p => [norm(p.barcode), p]));
  for(const r of rows){
    const d = {}; let hasQty = false;
    for(const [h, v] of Object.entries(r)){ const k = keyOf(h); if(!k) continue; d[k] = v; if(k === 'qty' && String(v).trim() !== '') hasQty = true; }
    const name = String(d.name ?? '').trim(); if(!name){ skipped++; continue; }
    const data = {name, updatedAt:Date.now()};
    for(const k of ['sku','barcode','category','location','supplier','unit','notes']) if(d[k] !== undefined) data[k] = String(d[k]).trim();
    for(const k of ['cost','price','minQty']) if(d[k] !== undefined && String(d[k]).trim() !== '') data[k] = num(d[k]);
    const ex = (data.sku && bySku.get(norm(data.sku))) || (data.barcode && byBc.get(norm(data.barcode)));
    if(ex){
      backend.update('products', ex.id, data); updated++;
      if(hasQty){ const delta = round(num(d.qty) - num(ex.qty)); if(delta) move(ex.id, delta, 'adjust', 'Import'); }
    } else {
      const q = hasQty ? round(num(d.qty)) : 0;
      const full = {sku:'', barcode:'', category:'', location:'', supplier:'', unit:'pcs', cost:0, price:0, minQty:0, notes:'', ...data, qty:q, createdAt:Date.now()};
      const id = backend.add('products', full); created++;
      if(full.sku) bySku.set(norm(full.sku), {id, ...full}); if(full.barcode) byBc.set(norm(full.barcode), {id, ...full});
      if(q) backend.add('movements', {productId:id, productName:name, sku:full.sku, type:'in', delta:q, before:0, after:q, note:'Import', user:uname(), ts:Date.now()});
    }
  }
  return {created, updated, skipped};
}

    el.querySelector('#stUn').onchange = () => this.refreshOpen(openCount());
    el.querySelector('#stAdd').onchange = e => { UI.addOne = e.target.checked; saveUI(); };
    el.querySelector('#stScan').onclick = () => countScanner();
    el.querySelector('#stFinish').onclick = () => countReportModal(openCount().id);
    const list = el.querySelector('#stList');
    list.addEventListener('change', e => {
      const i = e.target.closest('input[data-pid]'); if(!i) return;
      const c = openCount(); const pid = i.dataset.pid;
      const patch = {[`counted.${pid}`]: i.value.trim() === '' ? null : round(num(i.value))};
      if(c.expected?.[pid] === undefined) patch[`expected.${pid}`] = num(prod(pid)?.qty);
      backend.update('counts', c.id, patch);
    });
    list.addEventListener('click', e => { const b = e.target.closest('button[data-plus]'); if(b) countScan(b.dataset.plus, 1, true); });
  },
  refreshOpen(c){
    if(!c) return;
    const exp = c.expected || {}, cnt = c.counted || {};
    const ids = Object.keys(exp);
    const done = ids.filter(id => cnt[id] != null).length;
    $('#stProg').innerHTML = `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${done} / ${ids.length} products counted</b><span class="muted small">Started ${fdate(c.createdAt)} by ${esc(c.by||'')}${c.scope?.category ? ' · '+esc(c.scope.category) : ''}${c.scope?.location ? ' · 📍'+esc(c.scope.location) : ''}${c.blind ? ' · blind' : ''}</span></div>

        <button class="btn sm" data-plus="${id}" title="Add 1">+1</button></div>`).join('')

  }

function countScan(pid, n = 1, forceAdd = false){
  const c = openCount(); if(!c) return;
  const p = prod(pid);
  if(c.expected?.[pid] === undefined) backend.update('counts', c.id, {[`expected.${pid}`]: num(p?.qty)});
  if(UI.addOne || forceAdd){ backend.inc('counts', c.id, `counted.${pid}`, n); beep(); return num(c.counted?.[pid]) + n; }
  return null;
}
function countScanner(){
  openScanner({title:'Scan to count', continuous:true,
    hint: UI.addOne ? 'Each scan adds 1 to the counted quantity. Scan every unit, or untick "Each scan adds 1" to type quantities.' : 'After each scan, enter the counted quantity.',
    onCode: (code, box) => {
      const p = findByCode(code);
      if(!p){ beep(false); box.innerHTML = `<div class="scanres minus">Unknown code: ${esc(code)}</div>`; return; }
      if(UI.addOne){ const n = countScan(p.id); box.innerHTML = `<div class="scanres"><b>${esc(p.name)}</b><br><span class="plus">Counted: ${fq(n)}</span> <span class="muted small">${esc(p.unit||'')}</span>
        <button class="btn sm" style="float:right" id="undo1">Undo</button></div>`;
        box.querySelector('#undo1').onclick = () => { backend.inc('counts', openCount().id, `counted.${p.id}`, -1); box.innerHTML = `<div class="scanres muted">Undone. ${esc(p.name)}: ${fq(n-1)}</div>`; };
        return; }
      beep();
      const c = openCount(); const cur = c.counted?.[p.id];
      box.innerHTML = `<form class="scanres" id="qf"><b>${esc(p.name)}</b> <span class="muted small">${cur != null ? `already counted: ${fq(cur)}` : 'not counted yet'}</span>
        <div class="inrow" style="margin-top:8px"><input id="qn" type="number" step="any" inputmode="decimal" placeholder="Qty" required>
        <button class="btn" type="button" id="qAdd">Add</button><button class="btn primary" type="submit">Set</button></div></form>`;
      const qn = box.querySelector('#qn'); qn.focus();
      const commit = add => { const v = round(num(qn.value)); const c = openCount();
        if(c.expected?.[p.id] === undefined) backend.update('counts', c.id, {[`expected.${p.id}`]: num(p.qty)});
        if(add) backend.inc('counts', c.id, `counted.${p.id}`, v); else backend.update('counts', c.id, {[`counted.${p.id}`]: v});
        box.innerHTML = `<div class="scanres plus">${esc(p.name)}: ${add ? `+${fq(v)}` : `set to ${fq(v)}`} ✓ — scan next</div>`; };
      box.querySelector('#qf').onsubmit = e => { e.preventDefault(); commit(false); };
      box.querySelector('#qAdd').onclick = () => { if(qn.value !== '') commit(true); };
    }});
}

function countReport(c, uncountedZero){
  const exp = c.expected || {}, cnt = c.counted || {};
  const rows = []; let valueVar = 0, countedN = 0, uncounted = 0;
  for(const [pid, e] of Object.entries(exp)){
    const p = prod(pid);
    let counted = cnt[pid];
    if(counted == null){ if(!uncountedZero){ uncounted++; rows.push({pid, p, name:p?.name || '(deleted)', sku:p?.sku||'', expected:e, counted:null, variance:null, value:null}); continue; } counted = 0; }
    else countedN++;
    const variance = round(counted - e), value = round(variance * num(p?.cost));
    valueVar += value;
    rows.push({pid, p, name:p?.name || '(deleted)', sku:p?.sku||'', expected:e, counted, variance, value});
  }
  rows.sort((a,b) => (a.variance == null) - (b.variance == null) || Math.abs(b.value||0) - Math.abs(a.value||0) || a.name.localeCompare(b.name));
  return {rows, valueVar: round(valueVar), countedN, uncounted, diffN: rows.filter(r => r.variance).length};
}

function countReportModal(cid){
  let zero = false;
  const m = openModal(`<div id="cr"></div>`, {wide:true, refresh: () => render()});
  function render(){
    const c = S.counts.find(x => x.id === cid); const el = m.querySelector('#cr'); if(!el) return;
    if(!c){ el.innerHTML = '<p class="muted">Count not found.</p>'; return; }
    const open = c.status === 'open';
    const r = countReport(c, open ? zero : c.uncountedZero);
    el.innerHTML = `<h2 style="margin-right:30px">${esc(c.name)} ${open ? '<span class="badge low">Open</span>' : c.applied ? '<span class="badge ok">Applied</span>' : '<span class="badge">Closed</span>'}</h2>
      <div class="kv"><div><b>Counted</b>${r.countedN} / ${Object.keys(c.expected||{}).length}</div><div><b>With difference</b>${r.diffN}</div>
        <div><b>Not counted</b>${r.uncounted}</div><div><b>Value difference</b><span class="${r.valueVar<0?'minus':r.valueVar>0?'plus':''}">${money(r.valueVar)}</span></div></div>
      <div class="tablewrap"><table><thead><tr><th>Product</th><th class="n">Expected</th><th class="n">Counted</th><th class="n">Diff</th><th class="n">Value</th></tr></thead><tbody>
      ${r.rows.map(x => `<tr><td>${esc(x.name)} <span class="muted small">${esc(x.sku)}</span></td><td class="n">${fq(x.expected)}</td><td class="n">${x.counted == null ? '<span class="muted">—</span>' : fq(x.counted)}</td>
        <td class="n ${x.variance<0?'minus':x.variance>0?'plus':''}">${x.variance == null ? '' : (x.variance>0?'+':'')+fq(x.variance)}</td><td class="n">${x.value == null ? '' : money(x.value)}</td></tr>`).join('')}
      </tbody></table></div>
      ${open ? `<label class="chk" style="margin-top:12px"><input type="checkbox" id="crZero" ${zero?'checked':''}> Treat products not counted as 0 (otherwise they're left unchanged)</label>
        <p class="muted small">Applying sets each counted product's stock to the counted quantity and logs it as a stocktake movement.</p>
        <div class="actions" style="flex-wrap:wrap"><button class="btn danger" id="crDel">Discard count</button><button class="btn" id="crExp">Export</button><button class="btn" id="crClose">Close without applying</button><button class="btn primary" id="crApply">Apply &amp; close</button></div>`
      : `<div class="actions"><button class="btn danger" id="crDel">Delete</button><button class="btn primary" id="crExp">Export report</button></div>`}`;
    el.querySelector('#crZero')?.addEventListener('change', e => { zero = e.target.checked; render(); });
    el.querySelector('#crExp').onclick = () => download(`${c.name.replace(/[^\w\- ]+/g,'')}.xlsx`, sheetBook({Count: r.rows.map(x => ({Product:x.name, SKU:x.sku, Expected:x.expected, Counted:x.counted ?? '', Difference:x.variance ?? '', 'Unit cost':num(x.p?.cost), 'Value difference':x.value ?? ''}))}));
    el.querySelector('#crDel').onclick = () => { if(confirm('Delete this count? Stock levels are not affected.')){ backend.remove('counts', cid); closeModal(); } };
    el.querySelector('#crClose')?.addEventListener('click', () => { if(!confirm('Close this count without changing stock?')) return; backend.update('counts', cid, {status:'closed', closedAt:Date.now(), applied:false, uncountedZero:zero}); closeModal(); toast('Count closed'); });
    el.querySelector('#crApply')?.addEventListener('click', () => {
      const changes = r.rows.filter(x => x.counted != null && x.p).map(x => ({pid:x.pid, delta: round(x.counted - num(x.p.qty))})).filter(x => x.delta);
      if(!confirm(`Apply this count? ${changes.length} product(s) will have their stock changed.`)) return;
      changes.forEach(x => move(x.pid, x.delta, 'count', `Stocktake: ${c.name}`));
      backend.update('counts', cid, {status:'closed', closedAt:Date.now(), applied:true, uncountedZero:zero});
      closeModal(); toast(`Stocktake applied · ${changes.length} adjusted`, 'ok');
    });
  }
  render();
}

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /workspaces/{ws}/{document=**} {
      // Only these accounts can read/write. Add your team's emails.
      allow read, write: if request.auth != null
        && request.auth.token.email in ['you@example.com', 'colleague@example.com'];

}`;
function parseConfig(txt){
  let s = txt.trim(); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b < a) throw new Error('No { … } object found');
  s = s.slice(a, b + 1).replace(/\/\/.*$/gm, '').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const o = JSON.parse(s); if(!o.apiKey || !o.projectId) throw new Error('Config needs apiKey and projectId'); return o;
}

let cur = null;
function route(){
  const name = (location.hash.slice(1) || 'dashboard');
  const v = V[name] ? name : 'dashboard';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === v));

}

let unsubs = [];
function start(user){
  S.user = user;
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').textContent = backend.mode === 'firebase' ? user.email : '';
  backend.setStatus();
  unsubs.forEach(f => f());
  let ready = 0;
  unsubs = ['products', 'movements', 'counts'].map(c => backend.watch(c, docs => {
    S[c] = docs;
    if(c === 'movements') S.movements.sort((a,b) => (b.ts||0) - (a.ts||0));
    if(c === 'products') S.products.forEach(p => { p.name = p.name || '(no name)'; });
    if(ready < 3){ ready++; if(ready === 3) route(); return; }
    try{ cur?.update?.(); modalState?.refresh?.(); }catch(e){ console.error(e); }
  }));
}

    if(!$('#loginForm').reportValidity()) return;
    try{ await backend.signUp($('#lEmail').value.trim(), $('#lPass').value); }catch(x){ err.textContent = msg(x); } };
  $('#lLocal').onclick = () => { if(confirm('Switch this device to local mode? (Data will only be stored in this browser.)')){ localStorage.removeItem(LS.cfg); location.reload(); } };
}

async function boot(){
  setupLogin();
  const cfg = FIREBASE_CONFIG || JSON.parse(localStorage.getItem(LS.cfg) || 'null');
  const ws = localStorage.getItem(LS.ws) || 'main';
  if(cfg){
    try{ backend = await makeFirebase(cfg, ws); }
    catch(e){ console.error(e); toast('Could not load Firebase (' + e.message + '). Using local mode.', 'err'); backend = makeLocal(); }
  } else backend = makeLocal();
  backend.onAuth(u => u ? start(u) : showLogin());
}
boot();
</script>
</body>
</html>
